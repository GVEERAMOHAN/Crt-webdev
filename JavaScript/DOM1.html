<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="msg">This is a paragraph</p>
    <button onclick="changeText()">Click me</button>

    <script>
        function changeText() {
            document.getElementById("msg").textContent = "Welcome to DOM manipulation";
        }
    </script>
</body>
</html>
