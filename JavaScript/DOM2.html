<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="box">hello</div>
    <button onclick="changeDiv()">Click me</button>
    <script>
        function changeDiv() {
            let items = document.getElementById("box");
            items.style.backgroundColor = "lightblue";
            items.style.fontSize = "50px";
        }
    </script>
</body>
</html>
