<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
        <h1 style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">Color Picker</h1>
        <div style="height: 300px; width: 300px; background-color: rgb(214, 202, 202); padding: 10px;">
            <input type="text" id="search">
            <button onclick="changeColor()"style="border: black 2px solid; border-radius: 5px; background-color: green; color: white;">Apply Color</button>
            <div id="coloring" style="height:200px; width:200px; margin-top:20px; border:1px solid black; background-color: white;"></div>
            <p id="text"></p>
        </div>
    </center>
    <script>
        function changeColor() {
            let input = document.getElementById("search").value;
            let item = document.getElementById("coloring");
            item.style.backgroundColor = document.getElementById("search").value;
            let text = document.getElementById("text").textContent = "Color changed to " + input + "!";
        }
    </script>
</body>
</html>
