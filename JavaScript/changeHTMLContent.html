<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo">Good Morning</p>
    <button onclick="changeFont()">Change Font</button>

    <script>
        function changeFont() {
            document.getElementById("demo").innerHTML = "<b>Bold Text<b>"
        }
    </script>
</body>
</html>
