<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2 id="colorText">I am colorful</h1>
    <button onclick="changeColor()">Find Text</button>

    <script>
        function changeColor(){
            let x = document.getElementById("colorText");
            x.style.color = "red";
            x.style.fontSize = "50px";
        }
    </script>
</body>
</html>
