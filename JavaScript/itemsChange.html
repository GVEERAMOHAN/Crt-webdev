<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="name" placeholder="Enter">
    <button onclick="addItem()">Add Item</button>          <!--Addeds elements intpo the list-->
    <button onclick="removeItem()">Rmove Items</button>    <!--Removes the last added element from the list-->
    <button onclick="clearAll()">Clear All</button>        <!--Removes all the elemnts from the list-->
    <button onclick="changeFirst()">Change color</button>  <!--Changes the last added elements color-->
    <ul id="list"></ul>

    <script>
        function addItem() {
            let item = document.createElement("li");
            item.textContent = document.getElementById("name").value;
            document.getElementById("list").appendChild(item);
        }
        function removeItem() {
            document.getElementById("list").removeChild(list.lastElementChild);
        }
        function clearAll() {
            document.getElementById("list").innerHTML = "";
            
        }
        function changeFirst() {
            document.getElementById("list").children[1].style.color = "red";
        }
    </script>
</body>
</html>
