<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            text-align: center;
            padding-top: 100px;
        }
        button{
            margin-left: 20px;
            color: white;
            background-color: green;
            border: solid green;
            border-radius: 7px;
            height: 25px;
        }
        button:hover{
            cursor: pointer;
            border: solid;
            border-color: green;
            background-color: white;
            color: green;
        }
    </style>
</head>
<body>
    <h1>Enter Username</h1>
    <input id="user" type="text" placeholder="Username">
    <button onclick="checkUsername()">Check</button>
    <div id="msg"></div>

    <script>
        function checkUsername(user){
            if(user.length < 5 || user.length > 15){
                msg.innerText = "Username must be 5-15 characters";
                return;
            }
            if(user.includes(" ")){
                msg.innerText="Username can't have spaces";
                return;
            }
            let isValid = true;
            for (let char of user){
                if (!((char >= 'a' && char <= 'z') ||
                      (char >= 'A' && char <= 'Z') ||
                      (char >= '0' && char <= '9'))) {
                        isValid = false;
                        return;
                      }
            }
            if (isValid) {
                msg.innerText = "Valid Username!";
            }
            else {
                msg.innerText = "Only letters and numbers are allowed!!";
            }
        }
    </script>
</body>
</html>
