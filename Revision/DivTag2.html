<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding Div</title>
    <style>
        .box1{
            width: 45%;
            display: inline-block;
            padding: 10px;
            background-color: #1abee7;
            text-align: center;
            margin: 10px;
            border-radius: 5px;
        }
        .box2{
            width: 45%;
            display: inline-block;
            padding: 10px;
            background-color: #e41b83;
            text-align: center;
            margin: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="box1">
        <h2>Our Services</h2>
        <p>Web Development, SEO, and Marketing.</p>
    </div>    
    <div class="box2">
        <h2>Our Mission</h2>
        <p>Helping businesses grow online.</p>
    </div>   

</body>
</html>
