<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
        }
        .container{
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 20px;
            margin: 200px;
        }
        .divclass{
            color: white;
            padding: 10px;
            width: 40px;
            height: 40px;
        }
        #box1{
            background-color: red;
            box-shadow: 0px 20px 35px rgb(134, 241, 234);
        }
        #box2{
            background-color: blue;
        }
        #box3{
            background-color: green;
        }
        #box4{
            color: black;
            background-color: yellow;
        }
        p{
            margin: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="divclass" id="box1">
            <p>1</p>
        </div>
        <div class="divclass" id="box2">
            <p>2</p>
        </div>
        <div class="divclass" id="box3">
            <p>3</p>
        </div>
        <div class="divclass" id="box4">
            <p>4</p>
        </div>
    </div>
</body>
</html>
