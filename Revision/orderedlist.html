<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>orderedlist</title>
    <style>
        body{
            background-color:black
        }
        h1{
            background-color:blue;
            color:pink;
            width:500px;
            border-radius:9px
        }
        .o{
            background-color:grey;
            width:230px;
            border-radius:9px
        }
        .i{
            background-color:orange;
            color:white;
            width:230px;
            border-radius:9px
        }
</style>
</head>
<body>
    <h1>Ordered Lists with Custom Styles</h3>
    <ol class="o" type="I">
        <li>History</li>
        <li>Geography</li>
        <li>Science</li>
    </ol>
    <ol class="i" type="a">
        <li>English</li>
        <li>Mathematics</li>
        <li>Arts</li>
    </ol>
</body>
</html>
